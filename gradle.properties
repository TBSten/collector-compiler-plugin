# ---------- Project (single source of truth) ----------
# Maven coordinates of every published module = GROUP:<project name>:VERSION_NAME (applied in the root build.gradle.kts).
# The Gradle plugin embeds these values at build time (generated BuildConfig).
GROUP=me.tbsten.collector
VERSION_NAME=0.1.0-SNAPSHOT
# Id of the Gradle plugin and of the compiler plugin it applies (CollectorNames.PLUGIN_ID in collector-compiler).
COMPILER_PLUGIN_ID=me.tbsten.collector

# ---------- Gradle ----------
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# ---------- Kotlin ----------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.ignoreDisabledTargets=true
